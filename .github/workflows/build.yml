name: Build Studio GM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: studio-gm
  cancel-in-progress: true

env:
  SGM_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type check (informational)
        run: npm run typecheck
        continue-on-error: true
      - run: npm run build:ci
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: update-file
          path: update-file

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: update-file
          path: update-file
      - run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: |
          npx cap add android
          cp -r android-overrides/res/. android/app/src/main/res/
          npx cap sync android
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle || true
          sed -i "s/versionName \"[^\"]*\"/versionName \"$(node -p "require('./package.json').version").${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle || true
      - name: Build the APK (signed with the key in android-signing/)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish to the "latest" release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Studio-GM.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Studio-GM.apk update-file/*.sgmupdate \
            --target "${GITHUB_SHA}" --title "Studio GM (latest)" \
            --notes "Build ${GITHUB_RUN_NUMBER}. Download Studio-GM.apk on your phone to install or update the app."
